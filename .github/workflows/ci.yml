name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: G0 + compile the example bundle for every zone and runtime
        run: |
          agentctl validate examples/package-advisor/agent.yaml --zone sbx
          for z in sbx staging canary prod; do
            agentctl compile examples/package-advisor/agent.yaml --zone $z --runtime openshell --out /tmp/os-$z.yaml
            agentctl compile examples/package-advisor/agent.yaml --zone $z --runtime substrate --out /tmp/sub-$z.yaml
          done
      - name: Compiled OpenShell policies pass openshell-eks-lab's policy lint
        run: |
          git clone -q --depth 1 https://github.com/sai337/openshell-eks-lab /tmp/oslab
          pip install -q -e /tmp/oslab
          oslab lint '/tmp/os-*.yaml'
      - run: shellcheck e2e/*.sh
